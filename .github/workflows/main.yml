name: CI Build

on: [push]

concurrency:
  group: ci-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Build Project
        run: |
          & "C:\Program Files\Epic Games\UE_5.7\Engine\Build\BatchFiles\RunUAT.bat" BuildCookRun -project="${{ github.workspace }}\GTARace.uproject" -targetplatform=Win64 -platform=Win64 -noP4 -clientconfig=Shipping -serverconfig=Shipping -build -cook -stage -pak -archive -archivedirectory="${{ github.workspace }}\BuildOutput" -target=GTARace -NoEditor -NoLiveCoding -iterate